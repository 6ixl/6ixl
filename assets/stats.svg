<svg xmlns="http://www.w3.org/2000/svg" width="440" height="210" viewBox="0 0 440 210" fill="none">
  
  <defs>
    <linearGradient id="stb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c084fc"/><stop offset=".5" stop-color="#7c3aed"/><stop offset="1" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="stf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c0a45"/><stop offset="1" stop-color="#0d0221"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="438" height="208" rx="16" fill="url(#stf)" stroke="url(#stb)" stroke-width="2"/>
  <text x="28" y="40" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#c084fc">Статистика GitHub</text>
  
    <circle cx="34" cy="72" r="4" fill="#c084fc"/>
    <text x="48" y="77" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#e9d5ff">Звёзды</text>
    <text x="260" y="77" text-anchor="end" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#f5f3ff">3</text>
    <circle cx="34" cy="94" r="4" fill="#a855f7"/>
    <text x="48" y="99" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#e9d5ff">Коммиты за год</text>
    <text x="260" y="99" text-anchor="end" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#f5f3ff">512</text>
    <circle cx="34" cy="116" r="4" fill="#7c3aed"/>
    <text x="48" y="121" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#e9d5ff">Pull requests</text>
    <text x="260" y="121" text-anchor="end" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#f5f3ff">4</text>
    <circle cx="34" cy="138" r="4" fill="#c084fc"/>
    <text x="48" y="143" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#e9d5ff">Issues</text>
    <text x="260" y="143" text-anchor="end" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#f5f3ff">2</text>
    <circle cx="34" cy="160" r="4" fill="#a855f7"/>
    <text x="48" y="165" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#e9d5ff">Репозитории</text>
    <text x="260" y="165" text-anchor="end" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#f5f3ff">3</text>
    <circle cx="34" cy="182" r="4" fill="#7c3aed"/>
    <text x="48" y="187" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#e9d5ff">Подписчики</text>
    <text x="260" y="187" text-anchor="end" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#f5f3ff">1</text>
  <g transform="translate(350 118)">
    <circle r="50" stroke="#2e1065" stroke-width="10"/>
    <circle r="50" stroke="url(#stb)" stroke-width="10" stroke-linecap="round" transform="rotate(-90)"
      stroke-dasharray="314.2" stroke-dashoffset="314.2">
      <animate attributeName="stroke-dashoffset" from="314.2" to="83.6" dur="1.6s" fill="freeze"/>
    </circle>
    <text y="6" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="800" fill="#f5f3ff">734</text>
    <text y="26" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#a78bfa">вклад за год</text>
  </g></svg>
